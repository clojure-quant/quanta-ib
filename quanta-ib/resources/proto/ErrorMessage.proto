syntax = "proto3";

package protobuf;

option java_outer_classname = "ErrorMessageProto";
option java_package = "com.ib.client.protobuf";
option csharp_namespace = "IBApi.protobuf";

message ErrorMessage {
    int32 id = 1;
    int64 errorTime = 2;
    int32 errorCode = 3;
    string errorMsg = 4;
    string advancedOrderRejectJson = 5;
}
