syntax = "proto3";

package protobuf;

option java_outer_classname = "TickReqParamsProto";
option java_package = "com.ib.client.protobuf";
option csharp_namespace = "IBApi.protobuf";

message TickReqParams {
    int32 reqId = 1;
	string minTick = 2;
	string bboExchange = 3;
    int32 snapshotPermissions = 4;
	string lastPricePrecision = 5;
	string lastSizePrecision = 6;
}
