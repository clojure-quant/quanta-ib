syntax = "proto3";

package protobuf;

option java_outer_classname = "OrderStatusProto";
option java_package = "com.ib.client.protobuf";
option csharp_namespace = "IBApi.protobuf";

message OrderStatus {
    int32 orderId = 1;
    string status = 2;
    string filled = 3;
    string remaining = 4;
    double avgFillPrice = 5;
    int64 permId = 6;
    int32 parentId = 7;
    double lastFillPrice = 8;
    int32 clientId = 9;
    string whyHeld = 10;
    double mktCapPrice = 11;
}
